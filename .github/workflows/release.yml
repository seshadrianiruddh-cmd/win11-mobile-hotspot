name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Standalone Executable
        shell: powershell
        run: |
          .\build.ps1

      - name: Package Release Archive
        shell: powershell
        run: |
          Compress-Archive -Path HotspotManager.exe, README.md, Hotspot.ico -DestinationPath HotspotManager-v1.0.0.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            HotspotManager.exe
            HotspotManager-v1.0.0.zip
          generate_release_notes: true
          draft: false
          prerelease: false
